<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" role="img" aria-label="Hesam Rad">
    <title>Hesam Rad</title>
    <style>
        .mark { fill: #0066cc; stroke: #0066cc; }
        @media (prefers-color-scheme: dark) {
            .mark { fill: #2997ff; stroke: #2997ff; }
        }
    </style>
    <g class="mark">
        <!-- Four petals, on the diagonals. -->
        <ellipse cx="256" cy="53" rx="51" ry="145" transform="rotate(45 256 256)"/>
        <ellipse cx="256" cy="53" rx="51" ry="145" transform="rotate(135 256 256)"/>
        <ellipse cx="256" cy="53" rx="51" ry="145" transform="rotate(225 256 256)"/>
        <ellipse cx="256" cy="53" rx="51" ry="145" transform="rotate(315 256 256)"/>
        <!-- Four dots, on the axes. -->
        <circle cx="256" cy="73" r="33" transform="rotate(0 256 256)"/>
        <circle cx="256" cy="73" r="33" transform="rotate(90 256 256)"/>
        <circle cx="256" cy="73" r="33" transform="rotate(180 256 256)"/>
        <circle cx="256" cy="73" r="33" transform="rotate(270 256 256)"/>
        <!-- The rosette: lobes, then a ring, then a disc. -->
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(0 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(22.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(45 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(67.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(90 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(112.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(135 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(157.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(180 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(202.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(225 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(247.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(270 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(292.5 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(315 256 256)"/>
        <ellipse cx="256" cy="215" rx="7" ry="10" transform="rotate(337.5 256 256)"/>
        <circle cx="256" cy="256" r="31" fill="none" stroke-width="3.5"/>
        <circle cx="256" cy="256" r="23"/>
    </g>
</svg>
